[workspace]
resolver = "3"
members = ["crates/ruvi-core", "crates/ruvicode"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/culcat/RuviCode"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
ruvi-core = { path = "crates/ruvi-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
wasmi = { version = "2.0", features = ["wat"] }
